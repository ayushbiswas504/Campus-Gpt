<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#3b82f6;
  --text:#e5e7eb;
  --muted:#9ca3af;
}

/* 🔥 Campus GPT Background */
body{
  margin:0;
  font-family:"Inter",sans-serif;
  color:var(--text);
  min-height:100vh;

  background:
    radial-gradient(circle at 85% 85%, rgba(255,183,0,.45), transparent 40%),
    radial-gradient(circle at 20% 20%, rgba(77,163,255,.25), transparent 40%),
    linear-gradient(135deg,#050816,#0b1f3a,#1e3c72);
}

/* Container */
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* Header */
.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-weight:600;
}

/* Grid */
.faculty-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

/* Card */
.faculty-card{
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(18px);
  border-radius:18px;
  padding:18px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 45px rgba(0,0,0,.6);
  transition:.25s;
}

.faculty-card:hover{
  transform:translateY(-4px);
  box-shadow:
    0 25px 55px rgba(0,0,0,.7),
    0 0 40px rgba(255,183,0,.25);
}

/* Faculty info */
.faculty-name{
  font-weight:600;
  font-size:16px;
}

.faculty-sub{
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px;
}

.free-time{
  font-size:12px;
  color:#22c55e;
  margin-bottom:12px;
}

/* Input */
.input{
  width:100%;
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #1f2937;
  background:#020617;
  color:white;
  font-size:12px;
  margin-bottom:8px;
}

/* Button */
.btn{
  width:100%;
  padding:9px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:white;
  font-size:12px;
  cursor:pointer;
  margin-top:6px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 12px 30px rgba(37,99,235,.6);
}

/* Status */
.status{
  font-size:12px;
  margin-top:6px;
  color:#22c55e;
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>👨‍🏫 Faculty Portal</h1>
    <p style="color:var(--muted);font-size:13px;">
      Ask doubts and book appointments with faculty
    </p>
  </div>

  <div class="faculty-grid">

    <!-- Faculty 1 -->
    <div class="faculty-card">
      <div class="faculty-name">Mr. Sharma</div>
      <div class="faculty-sub">Mathematics • sharma@college.edu</div>
      <div class="free-time">🟢 Free: 2:00 PM – 4:00 PM</div>

      <input class="input" placeholder="Type your doubt...">
      <button class="btn" onclick="sendDoubt(this)">Ask Doubt</button>

      <input class="input" type="date">
      <button class="btn" onclick="bookSlot(this)">Book Appointment</button>

      <div class="status"></div>
    </div>

    <!-- Faculty 2 -->
    <div class="faculty-card">
      <div class="faculty-name">Ms. Gupta</div>
      <div class="faculty-sub">English • gupta@college.edu</div>
      <div class="free-time">🟢 Free: 11:00 AM – 1:00 PM</div>

      <input class="input" placeholder="Type your doubt...">
      <button class="btn" onclick="sendDoubt(this)">Ask Doubt</button>

      <input class="input" type="date">
      <button class="btn" onclick="bookSlot(this)">Book Appointment</button>

      <div class="status"></div>
    </div>

    <!-- Faculty 3 -->
    <div class="faculty-card">
      <div class="faculty-name">Dr. Verma</div>
      <div class="faculty-sub">Physics • verma@college.edu</div>
      <div class="free-time">🟢 Free: 10:00 AM – 12:00 PM</div>

      <input class="input" placeholder="Type your doubt...">
      <button class="btn" onclick="sendDoubt(this)">Ask Doubt</button>

      <input class="input" type="date">
      <button class="btn" onclick="bookSlot(this)">Book Appointment</button>

      <div class="status"></div>
    </div>

  </div>
</div>

<script>
function sendDoubt(btn){
  const card = btn.closest(".faculty-card");
  const status = card.querySelector(".status");
  status.textContent = "✅ Doubt sent to faculty";
}

function bookSlot(btn){
  const card = btn.closest(".faculty-card");
  const date = card.querySelector('input[type="date"]').value;
  const status = card.querySelector(".status");

  if(!date){
    status.style.color = "#f97373";
    status.textContent = "⚠️ Please select a date";
    return;
  }

  status.style.color = "#22c55e";
  status.textContent = "📅 Appointment booked!";
}
</script>

</body>
</html>
